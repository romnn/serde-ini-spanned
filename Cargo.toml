[package]
name = "serde-ini-spanned"
version = "0.0.2"
edition = "2024"

publish = true
authors = ["romnn <contact@romnn.com>"]
description = "INI configuration file deserialization similar to Python's configparser"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/romnn/serde-ini-spanned"
documentation = "https://docs.rs/serde-ini-spanned"
repository = "https://github.com/romnn/serde-ini-spanned"
categories = ["encoding", "parser-implementations"]
keywords = [
  "parser",
  "ini",
  "cfg",
  "serde"
]
exclude = [
  ".typos.toml",
  ".ignore",
  ".bumpversion.toml",
  ".cargo/",
  "taskfile.yaml",
  "mise.toml",
  "mise.lock",
  "cooldown.toml",
  "clippy.toml",
  "experiments/",
  "test-data",
  "tests",
]

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[workspace]

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

# Audit dependencies over union feature sets instead of the full combination
# matrix, so feature-gated dependencies are still reachable.
[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
allow_attributes_without_reason = "deny" # every #[allow] must carry reason = "..."

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[dependencies]
serde = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }

# manual parsing
aho-corasick = "1"

# diagnostics
codespan-reporting = "0"

# # optional: pest parser
# pest = "2"
# pest_derive = "2"
# # optional: nom parser
# nom = "7"

[dev-dependencies]
color-eyre = "0"
similar-asserts = "1"
indoc = "2"
unindent = "0"

# pest-test = "0"
# pest-test-gen = "0"
